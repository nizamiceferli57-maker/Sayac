<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandıq sayacı</title>
<style>
  :root { --bg:#f4f5f7; --card:#ffffff; --fg:#14161a; --mut:#6b7280; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b0d10; --card:#14181d; --fg:#f2f4f7; --mut:#8b95a3; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --line:#232a32; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; text-align: center; }
  .user { font-size: 18px; font-weight: 600; word-break: break-all; }
  .meta { margin-top: 6px; color: var(--mut); font-size: 14px; }
  #t { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-weight: 800; font-size: clamp(64px, 24vw, 112px); line-height: 1.05; margin: 22px 0 6px; color: var(--ok); }
  #t.warn { color: var(--warn); }
  #t.bad { color: var(--bad); }
  #t.pulse { animation: p .5s ease-in-out infinite alternate; }
  @keyframes p { from { opacity: 1; } to { opacity: .55; } }
  .unit { color: var(--mut); font-size: 14px; }
  .sync { margin-top: 18px; font-size: 12px; color: var(--mut); }
  .sync.err { color: var(--bad); }
  a.btn { display: block; margin-top: 20px; padding: 14px; border-radius: 12px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="user" id="u">Sandıq sayacı</div>
  <div class="meta" id="m"></div>
  <div id="t">--.-</div>
  <div class="unit" id="unit">saniyə</div>
  <a class="btn" id="go" href="#" style="display:none">🔴 Canlı yayıma keç</a>
  <div class="sync" id="s">server vaxtı ilə sinxronlaşır…</div>
</div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var t = parseFloat(q.get("t"));            // açılma vaxtı (TikTok server epoch, saniyə)
  if (t > 1e12) t = t / 1000;
  var user = (q.get("u") || "").replace(/[^A-Za-z0-9._]/g, "");
  var coins = q.get("c"), people = q.get("p"), ratio = q.get("r");
  var el = document.getElementById("t"), st = document.getElementById("s");

  var shown = (q.get("n") || "").slice(0, 40);      // yarımçıq ad (bot göndərir)
  var gate = q.get("g") || "";                       // yönləndirici link (bot göndərir)
  var go = document.getElementById("go");
  if (shown) document.getElementById("u").textContent = "@" + shown;
  else if (user) document.getElementById("u").textContent = "@" + user;
  if (/^https:\/\//i.test(gate)) {                   // birbaşa TikTok linki YOXDUR: yalnız yönləndirici
    go.href = gate;
    go.style.display = "block";
  } else if (user) {                                 // köhnə link (gate yoxdur) → əvvəlki davranış
    go.href = "https://www.tiktok.com/@" + user + "/live";
    go.style.display = "block";
  }
  var meta = [];
  if (coins) meta.push(coins + " coin");
  if (people) meta.push(people + " nəfər");
  if (ratio) meta.push(ratio + "x");
  document.getElementById("m").textContent = meta.join("  ·  ");

  if (!(t > 1e9)) { el.textContent = "?"; st.textContent = "Link səhv: açılma vaxtı (t) yoxdur."; st.className = "sync err"; return; }

  // Server vaxtı: telefonun saatı yox, serverin HTTP "Date" başlığı. offset = serverVaxtı(ms) - performance.now().
  // performance.now() monoton saatdır: telefonun saatını irəli/geri çəkmək sayaça təsir etmir.
  var offset = null, halfWidth = null;

  function sample() {
    var t0 = performance.now();
    return fetch(location.pathname + "?_=" + Math.random().toString(36).slice(2), { method: "HEAD", cache: "no-store" })
      .then(function (r) {
        var t1 = performance.now();
        var d = r.headers.get("date");
        if (!d || (r.headers.get("age") && Number(r.headers.get("age")) > 0)) return null;   // keşdən gəlibsə atılır
        var ms = Date.parse(d);
        if (isNaN(ms)) return null;
        // Date saniyəyə yuvarlaqdır: real vaxt [ms, ms+1000); cavab t0..t1 arasında yaranıb
        return { lo: ms - t1, hi: ms + 1000 - t0 };
      }).catch(function () { return null; });
  }

  function sync() {
    var lo = -Infinity, hi = Infinity, got = 0, i = 0, all = [];
    function next() {
      if (i++ >= 20) return finish();
      sample().then(function (s) {
        if (s) { all.push(s); got++; if (s.lo > lo && s.lo <= hi) lo = s.lo; if (s.hi < hi && s.hi >= lo) hi = s.hi; if (lo <= hi && isFinite(lo) && isFinite(hi)) offset = (lo + hi) / 2; }
        setTimeout(next, 130);   // saniyə sərhədini tutmaq üçün sıx nümunələr
      });
    }
    function finish() {
      if (!got) { st.textContent = "⚠ server vaxtı alınmadı — yerli saat istifadə olunur"; st.className = "sync err"; if (offset === null) offset = Date.now() - performance.now(); return; }
      offset = (lo + hi) / 2; halfWidth = (hi - lo) / 2;
      st.className = "sync";
      st.textContent = "✓ server vaxtı ilə sinxron (±" + Math.max(halfWidth / 1000, 0.05).toFixed(1) + " san)";
    }
    next();
  }

  function now() { return performance.now() + offset; }

  function render() {
    if (offset !== null) {
      var left = t * 1000 - now();
      if (left <= 0) {
        el.textContent = "AÇILDI"; el.className = ""; el.style.fontSize = "clamp(40px, 14vw, 72px)";
        document.getElementById("unit").textContent = "";
        return;   // dayanır
      }
      var tenths = Math.floor(left / 100) / 10;     // 11.5, 0.6 kimi: onluq, yüzlük yox
      el.textContent = tenths.toFixed(1);
      el.className = left < 10000 ? (left < 5000 ? "bad pulse" : "warn") : "";
    }
    requestAnimationFrame(render);
  }

  sync();
  requestAnimationFrame(render);
  setInterval(sync, 120000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) sync(); });
})();
</script>
</body>
</html>
